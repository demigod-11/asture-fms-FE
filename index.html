<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Asture Finance Management System - Modern financial management solution" />
    <meta name="keywords" content="finance management, accounting, budgeting, financial planning, expense tracking" />
    <meta name="author" content="Asture Team" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://asture-fms.com/" />
    <meta property="og:title" content="Asture Finance Management System" />
    <meta property="og:description" content="Modern finance management solution for efficient accounting and budgeting" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://asture-fms.com/" />
    <meta property="twitter:title" content="Asture Finance Management System" />
    <meta property="twitter:description" content="Modern finance management solution for efficient accounting and budgeting" />
    <meta property="twitter:image" content="/og-image.png" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#073E60" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <title>Asture FMS</title>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,sans-serif;background:#f3f4f6;color:#111;" id="root-fallback">
        <p>Loading Asture FMS…</p>
      </div>
    </div>
    <script type="module">
      window.__ASTURE_LOAD_ERROR__ = null;
      try {
        await import('/src/main.tsx');
      } catch (e) {
        window.__ASTURE_LOAD_ERROR__ = e;
        var root = document.getElementById('root');
        var fallback = document.getElementById('root-fallback');
        if (root && fallback) {
          fallback.innerHTML = '<div style="padding:24px;max-width:560px;"><h2 style="margin:0 0 8px 0;font-size:18px;">Failed to load app</h2><pre style="margin:0;font-size:12px;overflow:auto;background:#fee;padding:12px;border-radius:8px;">' + (e && (e.message || String(e))) + '</pre><p style="margin:12px 0 0 0;font-size:14px;">Check the browser console (F12) for details.</p></div>';
        }
      }
    </script>
    
    <!-- Loading fallback -->
    <noscript>
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial, sans-serif;">
        <div style="text-align: center;">
          <h1>Asture Finance Management System</h1>
          <p>JavaScript is required to run this application.</p>
          <p>Please enable JavaScript in your browser to continue.</p>
        </div>
      </div>
    </noscript>
  </body>
</html>
